<a href="{{ card.url }}" class="tw-metric-card tw-tone-{{ card.tone|default:'blue' }}">
    <span class="tw-card-icon"><i class="{{ card.icon }}" aria-hidden="true"></i></span>
    <span class="tw-metric-value">{{ card.value }}</span>
    <span class="tw-metric-label">{{ card.label }}</span>
    <span class="tw-metric-description">{{ card.description }}</span>
</a>
