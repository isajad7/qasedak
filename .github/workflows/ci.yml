name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  django:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: core.settings.development
      DJANGO_SECRET_KEY: ci-test-secret
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost
      INSTALL_RUN_LIVE_BOT_CHECK: "false"
      INSTALL_RUN_LIVE_XUI_CHECK: "false"
      INSTALL_SEND_TELEGRAM_TEST_MESSAGE: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check

      - name: Django tests
        run: python manage.py test store.tests store.test_telegram_latency store.test_telegram_proxy_admin store.test_pasarguard_transport store.test_external_subscription_interval store.test_subscription_sync store.test_order_automation store.test_order_recovery store.test_order_revenue store.test_customer_assignment store.test_expenses customer_activity.tests customer_activity.test_outreach payments.tests

      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run

      - name: Shell syntax
        run: bash -n scripts/install.sh scripts/doctor.sh scripts/backup.sh scripts/update.sh scripts/timers.sh scripts/release_check.sh scripts/deploy/*.sh docker/*.sh

      - name: Deployment artifact checks
        run: python scripts/deploy/test_deploy.py

      - name: Whitespace check
        run: git diff --check HEAD^ HEAD

  build_image:
    needs: django
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the tested revision on the runner
        run: |
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "qasedak-development:$GITHUB_SHA" .
      - name: Export image and verification metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p "$RUNNER_TEMP/qasedak-image"
          docker image save "qasedak-development:$GITHUB_SHA" | gzip -1 > "$RUNNER_TEMP/qasedak-image/image.tar.gz"
          python scripts/deploy/image_config_id.py "$RUNNER_TEMP/qasedak-image/image.tar.gz" "qasedak-development:$GITHUB_SHA" > "$RUNNER_TEMP/qasedak-image/image.id"
          cd "$RUNNER_TEMP/qasedak-image"
          sha256sum image.tar.gz > image.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: qasedak-image-${{ github.sha }}
          path: ${{ runner.temp }}/qasedak-image/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  deploy_development:
    # Enable only after the new server's deploy config, SSH key, known_hosts, and backup hook are verified.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEV_AUTO_DEPLOY == 'true' }}
    needs: [django, build_image]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: development
    concurrency:
      group: qasedak-development-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: qasedak-image-${{ github.sha }}
          path: ${{ runner.temp }}/qasedak-image
      - name: Deploy tested commit to the configured development Compose service
        env:
          # Pin the new host so stale environment variables cannot deploy to the retired server.
          DEV_SSH_HOST: 103.75.196.232
          DEV_SSH_USER: root
          DEV_SSH_PORT: '22'
          DEV_SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          DEV_SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: bash scripts/deploy/github_dev_deploy.sh
