name: Paid order 1135 incident recovery
on:
  push:
    branches: [ci]
    paths:
      - .github/workflows/paid-order-recovery.yml
      - scripts/diagnostics/paid_order_1135_recovery.sh
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: development
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recover the explicitly requested verified paid order 1135
        env:
          DEV_SSH_HOST: ${{ vars.DEV_SSH_HOST }}
          DEV_SSH_USER: ${{ vars.DEV_SSH_USER }}
          DEV_SSH_PORT: ${{ vars.DEV_SSH_PORT }}
          DEV_SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          DEV_SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          ssh_dir="$(mktemp -d "$RUNNER_TEMP/qasedak-diagnostics.XXXXXXXX")"
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$DEV_SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEV_SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh -i "$ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -o ConnectTimeout=15 \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=6 -p "${DEV_SSH_PORT:-22}" \
            "$DEV_SSH_USER@$DEV_SSH_HOST" 'bash -s' < scripts/diagnostics/paid_order_1135_recovery.sh
